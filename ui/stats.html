<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nice Try — Where your time went</title>
<style>
  :root {
    --bg:#000000; --panel:#1C1C1E; --panel2:#2C2C2E; --ink:#FFFFFF;
    --soft:rgba(235,235,245,.60); --faint:rgba(235,235,245,.30);
    --placeholder:rgba(235,235,245,.50);
    /* --red is under 4.5 on a raised panel; this is the lightest red that
       clears text contrast there. --red stays for fills and red on black. */
    --red-text:#FF6961;
    --line:#38383A; --accent:#409CFF; --green:#46C45B; --red:#FF2D2A;
    --accent-soft:rgba(64,156,255,.15);
    --accent-fill:#0A84FF;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    --mono:"SF Mono",ui-monospace,"Consolas","Roboto Mono",monospace;
    --ease:cubic-bezier(.32,.72,0,1);
    --dur-fast:.16s; --dur-mid:.28s; --dur-slow:.42s;
  }
  @media (prefers-reduced-motion: reduce) {
    :root { --dur-fast:.01ms; --dur-mid:.01ms; --dur-slow:.01ms; }
    *, *::before, *::after {
      animation-duration:.01ms !important; animation-iteration-count:1 !important;
      transition-duration:.01ms !important; scroll-behavior:auto !important;
    }
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.6;
    min-height:100vh; display:flex; justify-content:center; padding:3.5rem 1.5rem; }
  .wrap { width:100%; max-width:42rem; }

  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
  @media (prefers-contrast: more) {
    :root { --line:#545458; --faint:rgba(235,235,245,.55); --soft:rgba(235,235,245,.85); }
    :focus-visible { outline-width:3px; }
  }

  .top { border-bottom:1px solid var(--line); padding-bottom:1.375rem; margin-bottom:2rem; }
  .eyebrow { font-size:0.875rem; font-weight:600; letter-spacing:-.006em; color:var(--accent); margin-bottom:0.375rem; }
  h1 { font-size:2rem; font-weight:700; letter-spacing:-.028em; line-height:1.12; }
  .top p { color:var(--soft); font-size:0.938rem; margin-top:0.375rem; letter-spacing:-.01em; }

  /* ---- day tabs: same segmented control as the access log ---- */
  .tabs { position:sticky; top:0.75rem; z-index:5;
          display:flex; margin-bottom:1.25rem;
          background:rgba(28,28,30,.72); padding:0.25rem; border-radius:0.625rem; isolation:isolate;
          -webkit-backdrop-filter:blur(20px) saturate(180%);
          backdrop-filter:blur(20px) saturate(180%);
          box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 2px 14px rgba(0,0,0,.35); }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))) {
    .tabs { background:var(--panel); }
  }
  @media (prefers-reduced-transparency: reduce) {
    .tabs { background:var(--panel); -webkit-backdrop-filter:none; backdrop-filter:none; }
  }
  @media (prefers-contrast: more) {
    .tabs { background:var(--panel); -webkit-backdrop-filter:none; backdrop-filter:none;
            box-shadow:none; border:1px solid var(--line); }
  }
  .tab-ind { position:absolute; top:0.25rem; bottom:0.25rem; left:0; z-index:0;
             background:var(--accent-fill); border-radius:0.438rem;
             box-shadow:0 1px 3px rgba(0,0,0,.3);
             transform:translateX(var(--ind-x,0)); width:var(--ind-w,0);
             transition:transform var(--dur-mid) var(--ease), width var(--dur-mid) var(--ease); }
  .tabs.no-anim .tab-ind { transition:none; }
  .tab { position:relative; z-index:1; background:none; border:none; color:var(--ink); font-family:inherit;
         font-size:0.875rem; font-weight:500; letter-spacing:-.01em;
         padding:0.438rem 0.875rem; border-radius:0.438rem; cursor:pointer; flex:1;
         transition:color var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease); }
  .tab[aria-selected="true"] { color:#FFFFFF; font-weight:600; }
  .tabs.is-press .tab-ind { transform:translateX(var(--ind-x,0)) scale(.96); }
  @media (prefers-reduced-motion: reduce) {
    .tabs.is-press .tab-ind { transform:translateX(var(--ind-x,0)); }
  }

  /* ---- headline numbers ---- */
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr)); gap:0.625rem; margin-bottom:1.25rem; }
  .card { background:var(--panel); border-radius:0.875rem; padding:1rem 1.125rem; }
  .card .k { font-size:0.813rem; color:var(--soft); letter-spacing:-.006em; }
  .card .v { font-size:1.75rem; font-weight:700; letter-spacing:-.028em; line-height:1.2; margin-top:0.125rem;
             font-variant-numeric:tabular-nums; }
  .card.good .v { color:var(--green); }
  .card.bad  .v { color:var(--red); }

  .panel { background:var(--panel); border-radius:0.875rem; padding:1.125rem 1.25rem; margin-bottom:1.25rem; }
  .panel h2 { font-size:1.0625rem; font-weight:600; letter-spacing:-.022em; margin-bottom:0.875rem; }

  .bar { display:flex; height:0.625rem; border-radius:980px; overflow:hidden; background:var(--panel2); }
  .bar div { transition:width var(--dur-slow) var(--ease); }
  .bar .p { background:var(--green); } .bar .j { background:var(--red); } .bar .n { background:var(--line); }
  .legend { display:flex; gap:1.25rem; margin-top:0.813rem; font-size:0.875rem; color:var(--soft); flex-wrap:wrap; }
  .legend span { display:flex; align-items:center; gap:0.438rem; }
  .legend b { color:var(--ink); font-variant-numeric:tabular-nums; font-weight:600; }
  .sw { width:0.5rem; height:0.5rem; border-radius:50%; flex:none; }

  /* ---- site breakdown ---- */
  .site { display:flex; align-items:center; gap:0.75rem; padding:0.563rem 0; border-bottom:1px solid var(--line);
          text-decoration:none; color:inherit; }
  .site:last-child { border-bottom:none; padding-bottom:0; }
  /* Flex row so the title can truncate while the tag keeps its full width —
     inside a single nowrap block the ellipsis would eat the tag on long
     titles, which is exactly the rows that need it most. */
  .site .n { display:flex; align-items:baseline; gap:0; min-width:0;
             font-size:0.938rem; letter-spacing:-.014em; }
  .site .n .ttl { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .site .n .go, .site .n .tag { flex:none; }
  .site .t { color:var(--soft); font-size:0.875rem; font-variant-numeric:tabular-nums; flex:none; }
  /* proportion bar under each row, so the list reads at a glance */
  .site-wrap { display:flex; flex-direction:column; gap:0.313rem; flex:1; min-width:0; }
  /* The bar is segmented by category, so a page that was junk for part of the
     day and work for the rest shows both rather than being flattened. */
  .site-bar { display:flex; height:0.25rem; border-radius:980px; background:var(--panel2); overflow:hidden; }
  .site-bar i { display:block; height:100%; transition:width var(--dur-slow) var(--ease); }
  .site-bar .p { background:var(--green); }
  .site-bar .j { background:var(--red); }
  .site-bar .n { background:var(--soft); }
  /* logged before categories were recorded — grey, asserting nothing */
  .site-bar .u { background:var(--line); }

  /* Where the row's time mostly went. Tinted capsule, same idiom as the
     access-log badges. */
  .tag { font-size:0.688rem; font-weight:600; letter-spacing:-.002em; margin-left:0.438rem;
         padding:0.063rem 0.438rem; border-radius:980px; white-space:nowrap; vertical-align:1px; }
  .tag.productive { background:rgba(70,196,91,.16);  color:var(--green); }
  .tag.junk       { background:rgba(255,45,42,.16);  color:var(--red-text); }
  .tag.neutral    { background:rgba(235,235,245,.12); color:var(--soft); }
  /* Verdict drawn from only part of the row's time — dimmed and marked "?",
     so a call made on three seconds of six minutes doesn't look certain. */
  .tag.partial { opacity:.65; }
  /* Rows that still have a URL open the page. Rows logged before URLs were
     recorded stay plain, so nothing looks clickable that isn't. */
  .site.is-link { cursor:pointer; margin:0 -0.5rem; padding-left:0.5rem; padding-right:0.5rem;
                  border-radius:0.5rem;
                  transition:background var(--dur-fast) var(--ease); }
  .site.is-link:hover { background:var(--panel2); }
  .site.is-link:hover .n { color:var(--accent); }
  .site.is-link .go { color:var(--accent); font-size:0.813rem; margin-left:0.313rem; }
  .site.is-link:active { opacity:.7; }
  /* A guessed row searches the site rather than opening the page — muted, so
     it doesn't claim to be the same thing as an exact link. */
  .site.is-guess .go { color:var(--soft); }
  .site.is-guess:hover .n { color:var(--soft); }

  /* ---- history ---- */
  .day { display:flex; align-items:center; gap:0.75rem; padding:0.5rem 0; }
  .day .d { width:5.5rem; flex:none; font-size:0.875rem; color:var(--soft); font-variant-numeric:tabular-nums; }
  .day .b { flex:1; display:flex; height:0.5rem; border-radius:980px; overflow:hidden; background:var(--panel2); }
  .day .pct { width:3rem; flex:none; text-align:right; font-size:0.875rem; font-variant-numeric:tabular-nums; }

  .empty { color:var(--soft); font-size:0.938rem; text-align:center; padding:3rem 1rem; line-height:1.6;
           background:var(--panel); border-radius:0.875rem; letter-spacing:-.01em; }
  .note { color:var(--soft); font-size:0.813rem; letter-spacing:-.006em; margin-top:0.75rem; }

  /* ---- back to top ----
     The page list runs long, so this floats once you're past a screen. Glass,
     because it sits over scrolling content — the same rule as the filter. */
  .totop { position:fixed; right:1.5rem; bottom:1.5rem; z-index:20;
           width:2.75rem; height:2.75rem; border:none; border-radius:50%;
           background:rgba(28,28,30,.72); color:var(--accent);
           font-size:1.125rem; line-height:1; cursor:pointer; font-family:inherit;
           -webkit-backdrop-filter:blur(20px) saturate(180%);
           backdrop-filter:blur(20px) saturate(180%);
           box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 4px 16px rgba(0,0,0,.45);
           opacity:0; visibility:hidden; transform:translateY(0.5rem);
           transition:opacity var(--dur-mid) var(--ease), transform var(--dur-mid) var(--ease),
                      visibility var(--dur-mid) var(--ease), background var(--dur-fast) var(--ease); }
  .totop.show { opacity:1; visibility:visible; transform:none; }
  .totop:hover { background:rgba(58,58,60,.82); }
  .totop:active { transform:scale(.92); }
  @media (prefers-reduced-motion: reduce) { .totop:active { transform:none; } }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))) {
    .totop { background:var(--panel2); }
  }
  @media (prefers-reduced-transparency: reduce) {
    .totop { background:var(--panel2); -webkit-backdrop-filter:none; backdrop-filter:none; }
  }
  @media (prefers-contrast: more) {
    .totop { background:var(--panel2); -webkit-backdrop-filter:none; backdrop-filter:none;
             border:1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="eyebrow">Nice Try · Scoreboard</div>
    <h1>Where your time went</h1>
    <p>Only counted while Chrome was focused and you weren't idle — this is attention, not wall-clock.</p>
  </div>

  <div class="tabs no-anim" role="tablist" aria-label="Pick a range">
    <span class="tab-ind" aria-hidden="true"></span>
    <button class="tab" role="tab" aria-selected="true"  data-r="today">Today</button>
    <button class="tab" role="tab" aria-selected="false" data-r="7">Last 7 days</button>
    <button class="tab" role="tab" aria-selected="false" data-r="all">All time</button>
  </div>

  <div id="body"></div>

</div>

<button class="totop" id="toTop" type="button" aria-label="Back to top" title="Back to top">↑</button>
<script src="stats.js"></script>
</body>
</html>
