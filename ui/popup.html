<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  /* ---- design tokens: one system, used everywhere ---- */
  :root {
    /* Apple dark-mode system greys — neutral, so the cool accent belongs.
       The popup sits one step up from black since it's already a floating
       surface over the browser chrome. */
    --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --line:#38383A;
    --ink:#FFFFFF;
    --soft:rgba(235,235,245,.60);
    --faint:rgba(235,235,245,.30);
    /* Placeholders sit on a panel, where .30 alpha is only 2.5:1. This is the
       lightest tone that still clears 4.5 there. */
    --placeholder:rgba(235,235,245,.50);
    /* --red is 3.8:1 on a raised panel and 4.0 on its own tinted fill, both
       under 4.5. This is the lightest red that clears text contrast on those
       surfaces; --red stays for fills and for red on black. */
    --red-text:#FF6961;
    /* Dark-mode variants: the light-mode blue only hits ~4.1:1 on black. */
    --accent:#409CFF; --green:#46C45B; --red:#FF2D2A;
    --accent-soft:rgba(64,156,255,.15);
    /* Two blues with different jobs: --accent is the lighter, AA-readable tone
       for text/rings on dark; --accent-fill is Apple system blue, dark enough
       that white button labels clear 3:1. One value cannot do both. */
    --accent-fill:#0A84FF;
    --r-lg:0.875rem; --r-md:0.625rem; --r-sm:0.4375rem; --r-pill:980px;
    --pad:1rem; --gap:0.875rem;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    --mono:"SF Mono",ui-monospace,Consolas,"Roboto Mono",monospace;
    /* Decelerating curve — fast out of the gate, long settle. Reads as a
       critically-damped spring (no overshoot) without a physics runtime. */
    --ease:cubic-bezier(.32,.72,0,1);
    --dur-fast:.16s; --dur-mid:.28s; --dur-slow:.42s;
  }
  /* Reduced motion: collapse every duration to ~0 at the token level, so any
     transition using them is neutralized without restating each rule. */
  @media (prefers-reduced-motion: reduce) {
    :root { --dur-fast:.01ms; --dur-mid:.01ms; --dur-slow:.01ms; }
    *, *::before, *::after {
      animation-duration:.01ms !important; animation-iteration-count:1 !important;
      transition-duration:.01ms !important; scroll-behavior:auto !important;
    }
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { width:22rem; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:0.875rem; }
  .app { padding:var(--pad); display:flex; flex-direction:column; gap:var(--gap); }

  /* ---- focus: keyboard-only rings. Never remove the outline without a
     replacement — :focus-visible keeps mouse clicks clean but leaves
     keyboard users an unmistakable target. ---- */
  :focus-visible {
    outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--r-sm);
  }
  @media (prefers-contrast: more) {
    :root { --line:#545458; --faint:rgba(235,235,245,.55); --soft:rgba(235,235,245,.85); }
    :focus-visible { outline-width:3px; }
    .card, .ai { border-width:2px; }
  }

  /* ---- shared primitives ---- */
  /* Grouped-list cards: elevation carries the separation, so no border. */
  .card { background:var(--card); border:1px solid transparent; border-radius:var(--r-lg); padding:var(--pad); }
  .lbl { font-family:var(--mono); font-size:0.625rem; letter-spacing:.1em; text-transform:uppercase; color:var(--soft); }
  .btn { border:none; border-radius:var(--r-pill); font-family:var(--sans); font-size:0.875rem; font-weight:600;
         padding:0.75rem 1rem; cursor:pointer; letter-spacing:-.01em;
         transition:filter var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease),
                    color var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease); }
  .btn-primary { background:var(--accent-fill); color:#FFFFFF; width:100%; }
  .btn-primary:hover { filter:brightness(1.1); }
  /* Tinted fill rather than an outline — the iOS secondary-button idiom. */
  .btn-ghost { background:var(--card); border:none; color:var(--accent); width:100%; font-weight:500; font-size:0.844rem; }
  .btn-ghost:hover { background:var(--card2); }
  /* Press feedback fires on pointer-down (the .is-press class is added by
     popup.js on pointerdown), not on click — the spec's first rule. The
     :active fallback covers keyboard Space/Enter activation. */
  .btn.is-press, .btn:active { transform:scale(.975); filter:brightness(.94); }
  .icon-btn.is-press, .icon-btn:active { transform:scale(.9); }
  #addBtn.is-press, #addBtn:active { transform:scale(.92); }
  @media (prefers-reduced-motion: reduce) {
    .btn.is-press, .btn:active, .icon-btn.is-press, .icon-btn:active,
    #addBtn.is-press, #addBtn:active { transform:none; }
  }
  .row { display:flex; align-items:center; }
  .between { justify-content:space-between; }

  /* ---- header ---- */
  .head { display:flex; align-items:center; justify-content:space-between; padding-bottom:2px; }
  .id { display:flex; align-items:center; gap:0.625rem; }
  /* The mark carries the status dot rather than sitting beside it — two
     separate indicators next to the name crowded the header. */
  .mark-wrap { position:relative; flex:none; line-height:0; }
  .mark { width:1.75rem; height:1.75rem; display:block; }
  .dot { position:absolute; right:-1px; bottom:0; width:0.563rem; height:0.563rem; border-radius:50%;
         background:var(--green); box-shadow:0 0 7px var(--green); flex:none;
         /* ring in the surface colour so the dot reads as sitting on top */
         outline:2px solid var(--bg);
         transition:background var(--dur-mid) var(--ease),box-shadow var(--dur-mid) var(--ease); }
  .dot.off { background:var(--faint); box-shadow:none; }
  .id h1 { font-size:1.063rem; font-weight:600; letter-spacing:-.022em; line-height:1.2; }
  .id .sub { font-family:var(--sans); font-size:0.75rem; letter-spacing:-.006em; color:var(--soft); margin-top:1px; }
  .tools { display:flex; align-items:center; gap:0.5rem; }
  .icon-btn { background:none; border:none; color:var(--soft); cursor:pointer; padding:5px; border-radius:var(--r-sm); line-height:0;
              transition:color var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease); }
  .icon-btn:hover { color:var(--accent); background:var(--card); }
  .icon-btn svg { width:1rem; height:1rem; }
  /* iOS switch: 51×31pt, knob inset 2pt, full travel. Off-state is a neutral
     fill, not a border colour. */
  .switch { position:relative; width:3.188rem; height:1.938rem; flex:none; }
  /* Keep the input focusable and hit-testable rather than 0×0 — a zero-size
     control can't receive :focus-visible, which strands keyboard users. */
  .switch input { position:absolute; inset:0; width:100%; height:100%; opacity:0; margin:0; cursor:pointer; }
  .slider { position:absolute; inset:0; background:#39393D; border-radius:980px; cursor:pointer;
            pointer-events:none; transition:background var(--dur-mid) var(--ease); }
  .slider::before { content:""; position:absolute; width:1.688rem; height:1.688rem; left:2px; top:2px; background:#fff;
                    border-radius:50%; box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);
                    transition:transform var(--dur-mid) var(--ease); }
  input:checked + .slider { background:var(--green); }
  input:checked + .slider::before { transform:translateX(1.25rem); }
  .switch input:focus-visible + .slider { outline:2px solid var(--accent); outline-offset:3px; }

  /* ---- todo list ---- */
  .todo-head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:0.75rem; }
  .todo-head .count { font-family:var(--sans); font-size:0.75rem; color:var(--soft); font-variant-numeric:tabular-nums; }
  /* fixed-height, scrollable task list */
  #todoList {
    display:flex; flex-direction:column;
    height:11rem;               /* ~4 tasks visible, constant regardless of count */
    overflow-y:auto; overflow-x:hidden;
    padding-right:8px;          /* keep text off the scrollbar */
    scrollbar-width:thin;                        /* Firefox */
    scrollbar-color:var(--line) transparent;
  }
  #todoList::-webkit-scrollbar { width:6px; }
  #todoList::-webkit-scrollbar-track { background:transparent; margin:2px 0; }
  #todoList::-webkit-scrollbar-thumb {
    background:rgba(64,156,255,.35); border-radius:20px;
  }
  #todoList::-webkit-scrollbar-thumb:hover { background:rgba(64,156,255,.65); }
  /* list is a flex column: stop items being squashed when it overflows */
  #todoList > * { flex:none; }
  .todo { display:flex; align-items:flex-start; gap:0.688rem; padding:0.563rem 0; border-bottom:1px solid var(--line); }
  .todo:first-child { padding-top:0; }
  .todo:last-child { border-bottom:none; padding-bottom:2px; }
  /* Round checkbox — the iOS list-selection shape, not a square tickbox. */
  .box { width:1.375rem; height:1.375rem; margin-top:1px; border:1.5px solid var(--line); border-radius:50%;
         background:transparent; cursor:pointer; flex:none; position:relative;
         transition:background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease); }
  .box:hover { border-color:var(--accent); }
  .box:active { transform:scale(.88); }
  .todo.done .box { background:var(--green); border-color:var(--green); }
  .todo.done .box::after { content:"✓"; position:absolute; inset:0; display:flex; align-items:center;
                            justify-content:center; color:#fff; font-size:0.813rem; font-weight:700; }
  .todo .body { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .todo .txt { font-size:0.938rem; line-height:1.4; letter-spacing:-.014em; word-break:break-word; cursor:pointer; }
  .todo.done .txt { color:var(--faint); text-decoration:line-through; }
  /* The exempted page, as a real link. Accent-coloured because it is
     tappable — the green was reading as a status badge, which is why it did
     not look clickable. The trailing note stays secondary so the host is what
     the eye lands on. */
  .todo-sub { display:inline-flex; align-items:baseline; gap:0.25rem; align-self:flex-start;
              max-width:100%; margin-top:1px; padding:1px 0;
              font-size:0.75rem; line-height:1.35; letter-spacing:-.006em;
              color:var(--accent); text-decoration:none; cursor:pointer;
              overflow-wrap:anywhere; border-radius:var(--r-sm);
              transition:color var(--dur-fast) var(--ease); }
  .todo-sub:hover .lk-tx { text-decoration:underline; }
  .todo-sub .lk-ico { font-size:0.688rem; flex:none; opacity:.85; }
  .todo-sub .lk-note { color:var(--soft); flex:none; }
  .todo-sub:active { opacity:.6; }
  .todo.done .todo-sub { color:var(--faint); }
  .todo.done .todo-sub .lk-note { color:var(--faint); }
  .todo .del { background:none; border:none; color:var(--faint); cursor:pointer; font-size:1.125rem;
               line-height:1; padding:0 2px; flex:none; transition:color var(--dur-fast) var(--ease); }
  .todo:hover .del { color:var(--soft); }
  .todo .del:hover { color:var(--red); }
  .empty { color:var(--soft); font-size:0.813rem; padding:4px 0 10px; line-height:1.5; }

  .add-row { display:flex; gap:0.5rem; margin-top:0.75rem; }
  #todoInput { flex:1; background:var(--card2); border:none; border-radius:var(--r-pill);
               color:var(--ink); font-family:var(--sans); font-size:0.875rem; padding:0.688rem 1rem;
               letter-spacing:-.01em;
               transition:box-shadow var(--dur-fast) var(--ease); }
  /* min-width:0 lets the flex item shrink below its content width; without it
     the input refuses to shrink and the placeholder is clipped mid-word. */
  #todoInput { min-width:0; }
  #todoInput:focus { outline:none; box-shadow:0 0 0 4px var(--accent-soft); }
  /* If the placeholder still cannot fit (larger text sizes), end it with an
     ellipsis rather than slicing a word in half. */
  #todoInput::placeholder { color:var(--placeholder); text-overflow:ellipsis; }
  #addBtn { background:var(--accent-fill); border:none; color:#FFFFFF; border-radius:50%;
            width:2.375rem; height:2.375rem; font-size:1.375rem; line-height:1; cursor:pointer; flex:none;
            transition:filter var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease); }
  #addBtn:hover { filter:brightness(1.1); }

  /* ---- scoreboard ---- */
  .score-head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:0.688rem; }
  .score-head .pc { font-family:var(--sans); font-size:0.813rem; color:var(--soft); font-variant-numeric:tabular-nums; }
  .bar { display:flex; height:0.5rem; border-radius:980px; overflow:hidden; background:var(--card2); }
  .bar div { transition:width var(--dur-slow) var(--ease); }
  .bar .p { background:var(--green); } .bar .j { background:var(--red); } .bar .n { background:var(--line); }
  .legend { display:flex; gap:0.938rem; margin-top:0.688rem; font-size:0.813rem; color:var(--soft); }
  .legend span { display:flex; align-items:center; gap:6px; }
  .legend b { color:var(--ink); font-variant-numeric:tabular-nums; font-weight:600; }
  .sw { width:0.5rem; height:0.5rem; border-radius:50%; flex:none; }
  .verdict { font-size:0.813rem; line-height:1.45; color:var(--soft); letter-spacing:-.006em;
             margin-top:0.75rem; padding-top:0.75rem; border-top:1px solid var(--line); }
  .verdict.bad { color:var(--red); } .verdict.good { color:var(--green); }
  /* Sits under the verdict without a rule of its own — it is a footnote to
     the day's numbers, not a third headline competing with them. */
  .saved { font-size:0.813rem; line-height:1.45; letter-spacing:-.006em;
           margin-top:0.375rem; color:var(--soft); }
  .saved b { color:var(--accent); font-variant-numeric:tabular-nums; }
  .sites { margin-top:0.813rem; padding-top:0.75rem; border-top:1px solid var(--line); }
  .site { display:flex; justify-content:space-between; gap:0.625rem; font-size:0.813rem; padding:5px 0; }
  .site .n { color:var(--soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .site .t { color:var(--ink); font-variant-numeric:tabular-nums; flex:none; font-size:0.75rem; }

  /* ---- paused banner ----
     Only present while the extension is standing down. Amber rather than the
     accent, because this is a state that ends, not a feature. */
  .paused { display:flex; align-items:center; gap:0.625rem;
            background:rgba(255,159,10,.14); border-radius:var(--r-lg);
            padding:0.75rem 0.938rem; }
  .paused[hidden] { display:none; }
  .p-left { font-size:1.125rem; font-weight:700; letter-spacing:-.022em; color:#FF9F0A;
            font-variant-numeric:tabular-nums; flex:none; }
  .p-txt { flex:1; min-width:0; font-size:0.813rem; line-height:1.35; color:var(--soft);
           letter-spacing:-.006em; }
  .p-end { flex:none; background:none; border:none; color:#FF9F0A; font-family:inherit;
           font-size:0.813rem; font-weight:600; letter-spacing:-.006em; cursor:pointer;
           padding:2px 4px; border-radius:var(--r-sm); }
  .p-end:hover { text-decoration:underline; }

  /* ---- ai status ---- */
  .ai { display:flex; align-items:center; gap:0.563rem; font-size:0.813rem; padding:0.75rem 0.938rem;
        border:1px solid transparent; border-radius:var(--r-lg); background:var(--card); }
  .ai .pip { width:0.5rem; height:0.5rem; border-radius:50%; flex:none; background:var(--faint);
             transition:background var(--dur-mid) var(--ease); }
  .ai.ok .pip { background:var(--green); } .ai.err .pip { background:var(--red); }
  .ai .msg { flex:1; color:var(--soft); line-height:1.4; letter-spacing:-.006em; }
  .ai.err .msg { color:var(--red); }
  .ai .fix { color:var(--accent); cursor:pointer; flex:none; font-size:0.813rem; font-weight:500;
             background:none; border:none; font-family:inherit; padding:2px 4px; border-radius:var(--r-sm); }
  .ai .fix:hover { text-decoration:underline; }
  .msg-small { font-size:0.75rem; color:var(--soft); text-align:center; min-height:0.938rem; }
</style>
</head>
<body>
<div class="app">

  <div class="head">
    <div class="id">
      <span class="mark-wrap">
        <img class="mark" src="../assets/logo-mark.png" alt="" aria-hidden="true">
        <span class="dot" id="statusDot"></span>
      </span>
      <div>
        <h1>Nice Try</h1>
        <div class="sub" id="statusTag">watching your tabs</div>
      </div>
    </div>
    <div class="tools">
      <label class="switch" title="Turn nudging on/off">
        <input type="checkbox" id="enabled" checked><span class="slider"></span>
      </label>
      <button class="icon-btn" id="openSettings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>

  <div class="card">
    <div class="todo-head">
      <span class="lbl">Today's focus</span>
      <span class="count" id="todoCount"></span>
    </div>
    <div id="todoList"></div>
    <div class="add-row">
      <input id="todoInput" type="text" placeholder="Add a task, or paste a link" maxlength="300">
      <button id="addBtn" title="Add">+</button>
    </div>
  </div>

  <div class="paused" id="pausedBar" hidden>
    <span class="p-left" id="pausedLeft">3:00</span>
    <span class="p-txt">Nice Try is off. Nothing is blocked or tracked.</span>
    <button class="p-end" id="endPause" type="button">Resume now</button>
  </div>

  <div class="ai" id="aiStatus">
    <span class="pip"></span>
    <span class="msg" id="aiMsg">Checking AI…</span>
  </div>

  <div class="card">
    <div class="score-head">
      <span class="lbl">Today</span>
      <span class="pc" id="scorePct"></span>
    </div>
    <div class="bar">
      <div class="p" id="barP" style="width:0"></div>
      <div class="j" id="barJ" style="width:0"></div>
      <div class="n" id="barN" style="width:100%"></div>
    </div>
    <div class="legend">
      <span><i class="sw" style="background:var(--green)"></i>Focused <b id="pMin">0m</b></span>
      <span><i class="sw" style="background:var(--red)"></i>Wasted <b id="jMin">0m</b></span>
    </div>
    <p class="verdict" id="verdict">No data yet today.</p>
    <!-- Hidden until the first walk-away, so a fresh day doesn't open on a
         zero that looks like a failed target. -->
    <p class="saved" id="savedLine" hidden></p>
    <div class="sites" id="sites" style="display:none"></div>
  </div>

  <button class="btn btn-ghost" id="openAccess">What got past the wall</button>
  <button class="btn btn-ghost" id="openStats">Where your time went</button>
  <button class="btn btn-ghost" id="testLock">Lock this tab</button>
  <p class="msg-small" id="testMsg"></p>

</div>
<script src="popup.js"></script>
</body>
</html>
